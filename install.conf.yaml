# --- CONFIGURACIÓN DE DOTBOT ---
# Cada sección se ejecuta en orden. Los symlinks tienen "relink: true" para
# actualizar si ya existen. Brew muestra stdout/stderr para seguimiento.

- defaults:
    link:
      relink: true
    brew:
      stderr: true
      stdout: true

# --- LIMPIEZA PREVIA ---
# Elimina symlinks rotos en home directory (~) antes de crear nuevos.
# No borra archivos reales, solo limpia symlinks huérfanos.

- clean: ["~"]

# --- CREAR DIRECTORIOS ---
# Crea directorios que no existen y que necesitamos para los symlinks.

- create:
    - ~/Workspace          # Directorio de trabajo personal
    - ~/.config           # Configuración global (starship, nvim, etc)

# --- SYMLINKS ---
# Crea enlaces simbólicos desde ~ al repo de dotfiles.
# Ej: ~/.zshrc -> ~/.dotfiles/zshrc
# Si ya existen, se actualizan (relink: true).

- link:
    ~/.config/starship.toml: starship.toml   # Prompt moderno
    ~/.gitconfig: gitconfig                   # Config de Git
    ~/.zshrc: zshrc                           # Shell interactivo
    "$HOME/Library/Application Support/Antigravity/User/settings.json": settings.json  # IDE config (fonts, terminal, theme)

# --- BACKUP DE HOMEbrew EXISTENTE ---
# Por seguridad, hace backup del Brewfile actual del sistema
# antes de instalar anything. Guarda en Brewfile.bak.

- shell:
    - command: "brew bundle dump --force --file=~/.dotfiles/Brewfile.bak"
      description: "Backup preventivo de Homebrew"

# --- TAP (Repositorios adicionales de Homebrew) ---
# Tap = repositorio extra de fórmulas de Homebrew.
# hashicorp/tap = terraform y herramientas de HashiCorp.

- tap:
    - hashicorp/tap

# --- BREW (Formulae) - CLI Tools ---
# Paquetes CLI instalados via "brew install".
# Se ejecutan en orden, primero dependencies luego el resto.

- brew:
    # === MODERN CLI TOOLS ===
    # Reemplazos modernos de herramientas Unix classics
    # -------------------------------------------------------------------
    - mise        # Polyglot runtime manager (Node, Go, Python, etc)
    - uv          # Python ultrarrápido (reemplaza pip/poetry)
    - zoxide      # "cd" inteligente - aprende tus directorios frecuentes
    - eza         # "ls" moderno con icons, git status, colors
    - bat         # "cat" con syntax highlighting, line numbers
    - fzf         # Fuzzy finder - búsqueda interactiva en CLI
    - ripgrep     # "grep" ultrarrápido (rg)
    - fd          # "find" moderno y más rápido (fd)

    # === SHELL ENHANCEMENTS ===
    # -------------------------------------------------------------------
    - atuin       # Historial de shell con sync y búsqueda avanzada
    - zellij      # Terminal multiplexer (como tmux, pero en Rust)

    # === SYSTEM & MONITORING ===
    # -------------------------------------------------------------------
    - coreutils   # GNU coreutils (gls, greadlink, etc)
    - htop        # Monitor de procesos interactivo (mejor que top)
    - jq          # JSON processor - manipulate JSON en CLI
    - yq          # YAML processor - igual que jq pero para YAML

    # === CONTAINERS & ORCHESTRATION ===
    # -------------------------------------------------------------------
    - kubernetes-cli    # kubectl - gestión de K8s
    - kustomize         # K8s native config management
    - helm              # Package manager para K8s
    - k9s               # Terminal UI para K8s (alias: k9s --readonly)
    - stern             # Tail múltiples pods de K8s en tiempo real

    # === GIT & DEV TOOLS ===
    # -------------------------------------------------------------------
    - gh           # GitHub CLI - issues, PRs, repos desde terminal
    - git-delta    # Pager de git con syntax highlighting (bat para diffs)
    - lazygit      # TUI para git -Stage, commit, push, branch, etc
    - neovim       # Editor de texto moderno (fork de vim)
    - starship     # Prompt cross-shell - muestra info de Git, K8s, etc
    - opencode
    # ZSH Plugins
    - zsh-autosuggestions
    - zsh-syntax-highlighting     # AI coding assistant (este!)

    # === AI & LLM ===
    # -------------------------------------------------------------------
    - ollama       # Run LLMs localmente (Llama, Mistral, etc)

    # === INFRASTRUCTURE AS CODE ===
    # -------------------------------------------------------------------
    - terraform          # IaC de HashiCorp
    - terraform-docs     # Genera docs de tf modules
    - python@3.14        # Python 3.14

# --- CASKS - Apps de GUI ---
# Aplicaciones con interfaz gráfica instaladas via "brew install --cask".

- cask:
    - warp              # Terminal de IA (tu preferido)
    - rectangle         # Window manager - resize/snap windows
    - orbstack          # Containers + VMs ligeras (reemplaza Docker Desktop)
    - dbeaver-community # SQL client multi-database
    - appcleaner        # Desinstalador limpio para Mac
    # Apps原有
    - obsidian          # Notes app
    - kiro              # Editor
    - spotify           # Music
    - folx              # Download manager/torrent
    - lm-studio         # Run LLMs locally

# --- POST-INSTALL COMMANDS ---
# Comandos que se ejecutan DESPUÉS de instalar todo.

- shell:
    # Nerd Fonts - necesaria para icons en starship, neovim, eza, etc
    # Si falla, no rompe la instalación (|| true)
    - command: "brew install --cask font-meslo-lg-nerd-font || true"
      description: "Nerd Fonts para icons en terminal"

    # LazyVim - Starter config para Neovim
    # Solo clona si ~/.config/nvim NO existe
    - command: |
        if [ ! -d "$HOME/.config/nvim" ]; then
          git clone https://github.com/LazyVim/starter "$HOME/.config/nvim"
        fi
      description: "LazyVim setup (starter config)"

    # Mise - Instala runtimes que estén en ~/.config/mise.toml
    # "mise install" instala lo que esté configurado
    # "mise prune" limpia versiones antigas
    # Solo corre si mise ya está instalado (después del brew install)
    - command: "if command -v mise &> /dev/null; then mise install -y && mise prune -y; fi"
      description: "Mantenimiento de Runtimes (Node, Go, Python, etc)"

    # Limpieza de archivos temporales del home
    - command: "rm -rf ~/.zsh_sessions ~/.zcompcache ~/.python_history ~/.lesshst"
      description: "Limpieza de archivos temporales de shell"

    # Sincronización de Homebrew - cleanup de packages huérfanos
    # Compara Brewfile vs packages instalados y desinstala lo que no esté
    # en Brewfile (ej: si tenías ghostty instalado, lo quita)
    - command: "if [ -f ~/.dotfiles/Brewfile ]; then brew bundle cleanup --file=~/.dotfiles/Brewfile --force; else echo 'Brewfile not found, skipping cleanup'; fi"
      description: "Sincronización de Homebrew - elimina packages no listados"
