- defaults:
    link:
      relink: true
    brew:
      stderr: true
      stdout: true

- clean: ["~"]

- create:
    - ~/Workspace
    - ~/.config

- link:
    ~/.config/starship.toml: starship.toml
    ~/.gitconfig: gitconfig
    ~/.zshrc: zshrc

- shell:
    - command: "brew bundle dump --force --file=~/.dotfiles/Brewfile.bak"
      description: "Backup preventivo de Homebrew"

- tap:
    - fluxcd/tap
    - hashicorp/tap
    - infisical/get-cli

- brew:
    # Modern CLI
    - mise
    - uv
    - zoxide
    - eza
    - bat
    - fzf
    - ripgrep
    - fd
    - atuin
    - zellij
    # System & Monitoring
    - bottom
    - coreutils
    - htop
    - jq
    - yq
    # Containers & Orchestration
    - kubernetes-cli
    - kustomize
    - helm
    - fluxcd/tap/flux
    - k9s
    - stern
    # Git & Dev Tools
    - gh
    - git-delta
    - lazygit
    - git-flow-avh # Versión mantenida de git-flow
    - neovim
    - starship

- cask:
    - warp # Tu terminal de preferencia
    - rectangle
    - orbstack
    - dbeaver-community
    - appcleaner

- shell:
    - command: "brew install --cask font-meslo-lg-nerd-font || true"
      description: "Nerd Fonts para Warp y Neovim"

    - command: |
        if [ ! -d "$HOME/.config/nvim" ]; then
          git clone https://github.com/LazyVim/starter "$HOME/.config/nvim"
        fi
      description: "LazyVim setup"

    - command: "mise install -y && mise prune -y"
      description: "Mantenimiento de Runtimes"

    # Saneamiento de Home (Lo que eliminamos hoy)
    - command: "rm -rf ~/.zsh_sessions ~/.zcompcache ~/.python_history ~/.lesshst"
      description: "Limpieza de archivos temporales"

    # Sincronización final: esto eliminará ghostty y otros sobrantes
    - command: "if [ -f ~/.dotfiles/Brewfile ]; then brew bundle cleanup --file=~/.dotfiles/Brewfile --force; else echo 'Brewfile not found, skipping cleanup'; fi"
      description: "Sincronización quirúrgica de Homebrew"
