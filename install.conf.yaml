# --- DOTBOT CONFIGURATION ---
# Each section is executed in order. Symlinks have "relink: true" to update if they exist
# and "create: true" to create missing parent directories (e.g. ~/.config/ghostty).
# Shell steps show stdout/stderr so you can see what the Homebrew sync removes.
# THIS FILE IS THE SINGLE SOURCE OF TRUTH for packages: anything installed but not
# listed under "brew"/"cask" is removed by the Homebrew sync at the end.

- defaults:
      link:
          relink: true
          create: true
      shell:
          stdout: true
          stderr: true

# --- PREVIOUS CLEANUP ---
# Cleans up broken symlinks in the home directory (~) before creating new ones.
# Does not delete real files, only orphaned symlinks.

- clean: ["~"]

# --- CREATE DIRECTORIES ---
# Creates directories that do not exist and which are needed for the symlinks.

- create:
      - ~/Workspace # Personal workspace directory
      - ~/.config # Global configuration (starship, nvim, etc)

# --- SYMLINKS ---
# Creates symbolic links from ~ to the dotfiles repo.
# Example: ~/.zshrc -> ~/.dotfiles/zshrc
# If they already exist, they will be updated (relink: true).

- link:
      ~/.config/starship.toml: starship.toml # Modern prompt
      ~/.gitconfig: gitconfig # Git configuration
      ~/.zshrc: zshrc # Interactive shell
      "$HOME/Library/Application Support/Code/User/settings.json": settings.json # IDE config (fonts, terminal, theme)
      ~/.config/mise/config.toml: mise/config.toml # Runtime versions (Go, Python, Node)
      ~/.config/ghostty/config.ghostty: ghostty/config # Ghostty terminal config

# --- BACKUP EXISTING HOMEBREW ---
# For safety, backup the current system Brewfile
# before installing anything. Saves to Brewfile.bak.

- shell:
      - command: "brew bundle dump --force --file=~/.dotfiles/Brewfile.bak"
        description: "Preventive Homebrew backup"

# --- TAP (Additional Homebrew Repositories) ---
# Tap = extra repository of Homebrew formulas.
# hashicorp/tap = terraform and HashiCorp tools.
# anomalyco/tap = opencode-v2 (OpenCode CLI).
# sikarugir-app/sikarugir = sikarugir (Windows porting tool).

- tap:
      - hashicorp/tap
      - anomalyco/tap # opencode-v2
      - sikarugir-app/sikarugir # sikarugir (Wine/Windows app porting)

# --- TRUST TAPS ---
# Recent Homebrew refuses to load formulae/casks from non-official taps
# until they are trusted. Must run after "tap" and before "brew"/"cask".
# Keep this list in sync with the "tap" section above. It can't be derived
# with yq because yq itself is installed later, in the "brew" section.
# "|| true" keeps older Homebrew versions without `brew trust` from breaking the install.
# The Homebrew sync at the end rewrites the trust store from its temporary Brewfile,
# so it also declares these taps with "trusted: true" — keep all three places in sync.

- shell:
      - command: "brew trust --tap hashicorp/tap anomalyco/tap sikarugir-app/sikarugir || true"
        description: "Trust declared Homebrew taps"

# --- BREW (Formulae) - CLI Tools ---
# CLI packages installed via "brew install".
# Executed in order, first dependencies then the rest.

- brew:
      # === MODERN CLI TOOLS ===
      # Modern replacements for Unix classic tools
      # -------------------------------------------------------------------
      - mise # Polyglot runtime manager (Node, Go, Python, etc)
      - uv # Python ultrafast (replaces pip/poetry)
      - zoxide # Intelligent "cd" - learns your frequent directories
      - eza # "ls" modern with icons, git status, colors
      - bat # "cat" with syntax highlighting, line numbers
      - fzf # Fuzzy finder - interactive search in CLI
      - ripgrep # "grep" ultrafast (rg)
      - fd # "find" modern and faster (fd)
      - direnv # Auto-load env per project (.envrc)
      - tree # Directory tree view
      - lftp # Advanced file transfer
      - ffmpeg # Media processing (needed by many tools)
      - speedtest-go # Internet speed test (speedtest.net)
      - mole # Deep clean and optimize your Mac

      # === SHELL ENHANCEMENTS ===
      # -------------------------------------------------------------------
      - atuin # Shell history with sync and advanced search
      - zellij # Terminal multiplexer (like tmux, but in Rust)

      # === SYSTEM & MONITORING ===
      # -------------------------------------------------------------------
      - coreutils # GNU coreutils (gls, greadlink, etc)
      - htop # Interactive process monitor (better than top)
      - jq # JSON processor - manipulate JSON in CLI
      - yq # YAML processor - same as jq but for YAML

      # === CONTAINERS & ORCHESTRATION ===
      # -------------------------------------------------------------------
      - kubernetes-cli # kubectl - K8s management
      - kustomize # K8s native config management
      - helm # Package manager for K8s
      - k9s # Terminal UI for K8s (alias: k9s --readonly)
      - stern # Tail multiple K8s pods in real time

      # === GIT & DEV TOOLS ===
      # -------------------------------------------------------------------
      - gh # GitHub CLI - issues, PRs, repos from terminal
      - git-delta # Git pager with syntax highlighting (bat for diffs)
      - lazygit # TUI for git -Stage, commit, push, branch, etc
      - neovim # Modern text editor (fork of vim)
      - starship # Prompt cross-shell - shows info of Git, K8s, etc
      - anomalyco/tap/opencode-v2 # AI coding agent (installs the `opencode` binary)
      - infisical # Secrets manager CLI
      # ZSH Plugins
      - zsh-autosuggestions
      - zsh-syntax-highlighting # Fish-like syntax highlighting for zsh

      # === INFRASTRUCTURE AS CODE ===
      # -------------------------------------------------------------------
      - hashicorp/tap/terraform # IaC from HashiCorp
      - terraform-docs # Generates docs for tf modules

      # NOTE: Python/Go/Node runtimes come from mise (see mise/config.toml), not brew.
      # python@3.14 is not declared: brew installs it as a dependency of gcloud-cli.

# --- CASKS - GUI Apps ---
# GUI applications installed via "brew install --cask".

- cask:
      - ghostty # Fast, feature-rich terminal
      - rectangle # Window manager - resize/snap windows
      - orbstack # Containers + lightweight VMs (replaces Docker Desktop)
      - dbeaver-community # SQL client multi-database
      - appcleaner # Clean uninstaller for Mac
      # Productivity & media
      - obsidian # Notes app
      - spotify # Music
      - folx # Download manager/torrent
      - vorssaint # Menu bar toolkit (keep-awake, monitor, volume mixer)
      # Development
      - visual-studio-code # Code editor
      - gcloud-cli # Google Cloud CLI
      # AI & Agentic Tools
      - lm-studio # Run LLMs locally
      - lm-studio-bionic # LM Studio agent for open models
      - antigravity-cli # Google Antigravity CLI
      # Utilities & Porting
      - balenaetcher # Flash OS images to SD cards & USB drives
      - sikarugir # Porting tool to make Windows apps into native Mac apps

# --- POST-INSTALL COMMANDS ---
# Commands that run AFTER installing everything.

- shell:
      # Nerd Fonts - needed for icons in starship, neovim, eza, etc
      # If it fails, don't break installation (|| true)
      - command: "brew install --cask font-meslo-lg-nerd-font || true"
        description: "Nerd Fonts for terminal icons"

      # LazyVim - Starter config for Neovim
      # Only clone if ~/.config/nvim does NOT exist
      - command: |
            if [ ! -d "$HOME/.config/nvim" ]; then
              git clone https://github.com/LazyVim/starter "$HOME/.config/nvim"
            fi
        description: "LazyVim setup (starter config)"

      # Mise - Installs runtimes that are in ~/.config/mise/config.toml
      # "mise install" installs what is configured
      # "mise prune" cleans old versions
      # Only runs if mise is already installed (after brew install)
      - command: "if command -v mise &> /dev/null; then mise install -y && mise prune -y; fi"
        description: "Runtime maintenance (Node, Go, Python, etc)"

      # Cleanup of temporary files in home
      - command: "rm -rf ~/.zsh_sessions ~/.zcompcache ~/.python_history ~/.lesshst"
        description: "Cleanup of temporary shell files"

      # Homebrew synchronization - cleanup of orphaned packages
      # Builds a temporary Brewfile FROM this file (single source of truth),
      # then removes anything installed that is not listed here.
      # The Nerd Font is installed in post-install, so it is added as an exception.
      # Taps are declared "trusted: true" because `cleanup --force` resets Homebrew's
      # trust store to whatever the Brewfile says (otherwise it would undo `brew trust`).
      # Guards: aborts BEFORE removing anything if yq is missing or the generated
      # Brewfile has no formulae/casks (e.g. a broken YAML), which would otherwise
      # make `--force` uninstall everything.
      - command: |
            set -e
            CONFIG="$HOME/.dotfiles/install.conf.yaml"
            command -v yq >/dev/null 2>&1 || { echo "yq not found: skipping Homebrew sync"; exit 1; }
            T=$(mktemp)
            trap 'rm -f "$T"' EXIT
            { yq -r '.[] | select(has("tap"))  | .tap[]  | "tap \"\(.)\", trusted: true"' "$CONFIG"
              yq -r '.[] | select(has("brew")) | .brew[] | "brew \"\(.)\""' "$CONFIG"
              yq -r '.[] | select(has("cask")) | .cask[] | "cask \"\(.)\""' "$CONFIG"
              echo 'cask "font-meslo-lg-nerd-font"'; } > "$T"
            grep -q '^brew ' "$T" && grep -q '^cask ' "$T" || { echo "Generated Brewfile is empty: aborting Homebrew sync"; exit 1; }
            brew bundle cleanup --file="$T" --force
        description: "Homebrew sync — removes unlisted packages"
