- defaults:
    link:
      relink: true
    brew:
      - stderr: True,
      - stdout: True,

- clean: ["~"]

- create:
    - ~/Workspace
    - ~/.config

- link:
    ~/.config/starship.toml: starship.toml
    ~/.gitconfig: gitconfig
    ~/.zshrc: zshrc

- shell:
    - command: "brew bundle dump --force"
      stderr: True,
      stdout: True,
      description: Backup current Brew

- tap:
    - fluxcd/tap
    - hashicorp/tap
    - homebrew/services
    - infisical/get-cli
    - weaveworks/tap

- brew:
    # Core Modern Tools (Rust-based)
    - mise
    - uv
    - zoxide
    - eza
    - bat
    - fzf
    - ripgrep
    - fd
    - atuin
    - zellij
    # System & Monitoring
    - bottom
    - coreutils
    - htop
    - tree
    - jq
    # Containers & Orchestration
    - docker
    - docker-buildx
    - docker-compose
    - kubernetes-cli
    - kustomize
    - helm
    - fluxcd/tap/flux
    - k9s
    - stern
    # Dev Tools
    - gh
    - git-delta
    - git-flow
    - lazygit
    - neovim
    - starship

- cask:
    - ghostty
    - warp
    - rectangle
    - orbstack
    - dbeaver-community
    - appcleaner

- shell:
    - command: "brew search '/font-meslo-lg-nerd-font/' | awk '{ print $1 }' | xargs -I{} brew install --cask {} || true"
      stderr: True,
      stdout: True,
      description: Nerd Fonts for your IDE

    - command: "if [ ! -d \"$HOME/.config/nvim\" ]; then git clone https://github.com/LazyVim/starter \"$HOME/.config/nvim\"; else echo \"Neovim config already exists. Skipping LazyVim auto-install.\"; fi"
      stderr: True,
      stdout: True,
      description: Installing LazyVim

    - command: "mise install -y"
      stderr: True,
      stdout: True,
      description: Install languages via mise