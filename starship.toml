# ==============================================================================
# STARSHIP CONFIGURATION 2026 - DEVOPS & CLOUD — COST OPTIMIZED
# ==============================================================================

# Command timeout (prevents lag in large Git repositories)
command_timeout = 5000

# Prompt format: Layered order (OS -> Directory -> Git -> K8s/Cloud -> Languages)
format = """
$os$username$hostname$directory$git_branch$git_status$kubernetes$terraform$docker_context$package$python$nodejs$golang$rust$fill$cmd_duration$line_break$character"""

[fill]
symbol = " "

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

# --- DIRECTORY & SYSTEM ---
[directory]
read_only = " 󰌾"
truncation_length = 3
style = "bold blue"

[os]
disabled = false
style = "bold white"

[os.symbols]
Alpaquita = " "
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
Arch = " "
Artix = " "
CentOS = " "
Debian = " "
DragonFly = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = "󰛓 "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = "󰈸 "
Kali = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
OpenBSD = "󰈺 "
openSUSE = " "
OracleLinux = "󰌷 "
Pop = " "
Raspbian = " "
Redhat = " "
RedHatEnterprise = " "
RockyLinux = " "
Redox = "󰀘 "
Solus = "󰠳 "
SUSE = " "
Ubuntu = " "
Unknown = " "
Void = " "
Windows = "󰍲 "

# --- CLOUD & ORCHESTRATION (Critical for DevOps) ---
[kubernetes]
symbol = "󱃾 "
disabled = false
format = 'on [($symbol$context \($namespace\))]($style) '
style = "cyan bold"

[terraform]
symbol = "󱁢 "
format = 'via [$symbol$workspace]($style) '
style = "purple bold"

[aws]
symbol = "  "

[docker_context]
symbol = " "

# --- VERSION CONTROL ---
[git_branch]
symbol = " "
style = "bold yellow"

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'

# --- LANGUAGES & RUNTIMES ---
[python]
symbol = " "
# Optimized to detect 'uv' virtual environments
pyenv_prefix = "venv "
python_binary = ["./venv/bin/python", "python", "python3"]
format = 'via [$symbol$pyenv_prefix($version )(\($virtualenv\) )]($style)'

[nodejs]
symbol = " "
format = 'via [$symbol$version]($style) '
style = "green bold"

[golang]
symbol = " "
format = 'via [$symbol$version]($style) '
style = "cyan bold"

[rust]
symbol = " "
format = 'via [$symbol$version]($style) '
style = "red bold"

[package]
symbol = "󰏗 "

# --- UTILITIES ---
[cmd_duration]
min_time = 2000
format = 'took [$duration]($style) '
style = "yellow bold"

[hostname]
ssh_symbol = " "

